name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        # typegen gera os tipos de rotas (PageProps, RouteContext) usados no código
        run: npx next typegen && npx tsc --noEmit

      - name: Build
        # O build consulta api.cblow.xyz (times e treinos); não precisa de segredos.
        run: npm run build
